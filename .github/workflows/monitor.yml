name: Flight Price Monitor

on:
  schedule:
    # UTC 时间。原版 1,7,13,19 = 北京时间 09:00 / 15:00 / 21:00 / 03:00（每天4次）
    # 注意：scheduled 触发时没有 inputs，全部走下面 build_config 里的 fallback 默认值
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      from_code:
        description: '出发地三字码 (如 DLC)'
        required: true
        default: 'DLC'
      from_name:
        description: '出发地名称 (如 大连)'
        required: true
        default: '大连'
      to_code:
        description: '目的地三字码 (如 CGO)'
        required: true
        default: 'CGO'
      to_name:
        description: '目的地名称 (如 郑州)'
        required: true
        default: '郑州'
      depart_dates:
        description: '去程日期, 逗号分隔'
        required: true
        default: '2027-02-03,2027-02-04'
      return_dates:
        description: '回程日期, 逗号分隔 (可选, 默认只监控去程单程)'
        required: false
        default: ''
      platforms:
        description: '平台: fliggy,tuniu,qunar,tongcheng,ctrip'
        required: false
        default: 'fliggy,tuniu,qunar,tongcheng'
      threshold:
        description: '低价提醒阈值（元）'
        required: false
        default: '770'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      # scheduled 触发时 github.event.inputs 为空，全部使用下面 || 后的 fallback。
      # 默认只监控大连(DLC)→郑州(CGO) 去程 2027-02-03、2027-02-04 两天，不监控回程。
      - name: Build config from workflow_dispatch or defaults
        run: |
          python scripts/build_config.py \
            --from-code "${{ github.event.inputs.from_code || 'DLC' }}" \
            --from-name "${{ github.event.inputs.from_name || '大连' }}" \
            --to-code "${{ github.event.inputs.to_code || 'CGO' }}" \
            --to-name "${{ github.event.inputs.to_name || '郑州' }}" \
            --dates "${{ github.event.inputs.depart_dates || '2027-02-03,2027-02-04' }}" \
            --return-dates "${{ github.event.inputs.return_dates || '' }}" \
            --platforms "${{ github.event.inputs.platforms || 'fliggy,tuniu,qunar,tongcheng' }}" \
            --threshold "${{ github.event.inputs.threshold || '770' }}" \
            --serverchan-key "${{ secrets.SERVERCHAN_KEY }}" \
            --output config.yaml

      - name: Run price monitor (one round)
        run: python main.py --once
        timeout-minutes: 15

      - name: Export latest results to JSON
        run: |
          mkdir -p docs/data
          python scripts/export_results.py \
            --db data/prices.db \
            --out docs/data/latest.json

      - name: Render HTML report
        run: |
          python scripts/render_report.py \
            --results-file docs/data/latest.json \
            --out-dir docs/data

      - name: Commit data & report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update price data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
